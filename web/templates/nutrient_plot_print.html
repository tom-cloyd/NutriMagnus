<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — NutriMagnus</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12pt;
      color: #111;
      max-width: 52rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
    .meta { color: #555; font-size: 0.9rem; margin-bottom: 1rem; }
    img { max-width: 100%; }
    .no-print { margin-top: 1.5rem; }
    .btn-print {
      display: inline-block; padding: 0.4rem 1.1rem; background: #1a3a6b; color: #fff;
      border: none; border-radius: 4px; font-size: 0.9rem; cursor: pointer; margin-right: 0.5rem;
    }
    .btn-back {
      display: inline-block; padding: 0.4rem 1.1rem; background: #e9ecef; color: #333;
      border: 1px solid #adb5bd; border-radius: 4px; font-size: 0.9rem; cursor: pointer;
      text-decoration: none; margin-right: 0.5rem;
    }
    @media print {
      .no-print { display: none; }
      body { margin: 0; }
    }
  </style>
</head>
<body>

<div class="no-print">
  <button class="btn-print" onclick="window.print()">Print / Save as PDF</button>
  <a class="btn-back" href="/summary/nutrient-plot/image?{{ qs }}&download=1">Download PNG</a>
  <a class="btn-back" href="/summary/nutrient-plot/image?{{ qs }}&fmt=svg&download=1">Download SVG</a>
  <a class="btn-back" href="/summary/nutrient-plot?{{ qs }}">Back to plot</a>
  <a class="btn-back" href="/summary">Back to Daily Summary</a>
</div>

<h1>{{ title }}</h1>
<p class="meta">{{ labels|join(", ") }} &mdash; {{ start_date }} to {{ end_date }}</p>

<img src="/summary/nutrient-plot/image?{{ qs }}" alt="Nutrient plot">

</body>
</html>
