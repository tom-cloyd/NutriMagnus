[mutmut]
# A whole-package copy: naming the individual files works only while a
# source_path already creates numa_app/ inside mutants/, which is not the case
# when the module under test lives at the repo root (usda_nutrients.py).
also_copy=
	numa_app/
source_paths=
	usda_nutrients.py
pytest_add_cli_args_test_selection=
	tests/test_usda.py
	tests/test_diaas.py
